<style>
/* ===== SCROLL REVEAL ANIMATION ===== */
.reveal {
  opacity: 0;
  transform: translateY(60px);
  transition: all 0.9s ease;
}
.reveal.active {
  opacity: 1;
  transform: translateY(0);
}

/* ===== SMOOTH HOVER EFFECT ===== */
.card, .fp-slide, .grid > div {
  transition: all 0.4s ease;
}
.card:hover, .fp-slide:hover {
  transform: translateY(-8px);
}

/* ===== BUTTON ANIMATION ===== */
.btn {
  transition: all 0.3s ease;
  cursor: pointer;
}
.btn:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(201,162,39,0.4);
}

/* ===== IMAGE ZOOM ===== */
.img, .slider img {
  transition: transform 0.6s ease;
}
.img:hover, .slider img:hover {
  transform: scale(1.05);
}

/* ===== HERO FADE IN ===== */
.hero-content {
  opacity: 0;
  transform: translateY(40px);
  animation: heroFade 1.5s ease forwards;
}
@keyframes heroFade {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== SMOOTH SCROLL ===== */
html {
  scroll-behavior: smooth;
}
</style>

  
<script>
/* ===== SCROLL REVEAL ===== */
document.addEventListener("DOMContentLoaded", function() {
  const revealElements = document.querySelectorAll(".section, .card");
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add("active");
      }
    });
  }, { threshold: 0.15 });

  revealElements.forEach(el => {
    el.classList.add("reveal");
    observer.observe(el);
  });
});

/* ===== COUNTER ANIMATION ===== */
document.addEventListener("DOMContentLoaded", function(){
  const counters = document.querySelectorAll("h3");
  counters.forEach(counter => {
    if(counter.innerText.includes("+") || counter.innerText.includes("%")){
      let target = parseInt(counter.innerText);
      let count = 0;
      let increment = target / 100;
      function update(){
        if(count < target){
          count += increment;
          counter.innerText = Math.ceil(count) + (counter.innerText.includes("%") ? "%" : "+");
          requestAnimationFrame(update);
        } else {
          counter.innerText = target + (counter.innerText.includes("%") ? "%" : "+");
        }
      }
      update();
    }
  });
});

/* ===== PARALLAX EFFECT HERO ===== */
window.addEventListener("scroll", function(){
  const hero = document.querySelector(".hero-video");
  if(hero){
    hero.style.transform = "translateY(" + window.scrollY * 0.3 + "px)";
  }
});

/* ===== WHATSAPP SENDING FUNCTION (FIXED) ===== */
function sendToWhatsApp() {
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const apartment = document.getElementById("apartment").value;
  const msg = document.getElementById("msg").value;
  
  const whatsappMsg = `*Hooria Residency Booking Request*%0A%0A*Name:* ${name}%0A*Phone:* ${phone}%0A*Apartment:* ${apartment}%0A*Message:* ${msg}`;
  window.open(`https://wa.me/923355902222?text=${whatsappMsg}`, '_blank');
}
</script>

<script>
/* ===== TAB & MODAL FUNCTIONS (FIXED) ===== */
function openTab(event, tabId){
  document.querySelectorAll(".tab-content").forEach(tab=>tab.classList.remove("active"))
  document.querySelectorAll(".tab-btn").forEach(btn=>btn.classList.remove("active"))

  document.getElementById(tabId).classList.add("active")
  if(event && event.target) {
    event.target.classList.add("active")
  }
}

function openModal(src){
  document.getElementById("imgModal").style.display="block"
  document.getElementById("modalImg").src=src
}

function closeModal(){
  document.getElementById("imgModal").style.display="none"
}

let fpIndex = 0;
let fpSlides = [];
let fpDotEls = [];

function fpSlide(dir) {
  fpSlides[fpIndex].classList.remove("active");
  fpDotEls[fpIndex].classList.remove("active");
  fpIndex = (fpIndex + dir + fpSlides.length) % fpSlides.length;
  fpSlides[fpIndex].classList.add("active");
  fpDotEls[fpIndex].classList.add("active");
}

function fpGoTo(idx) {
  fpSlides[fpIndex].classList.remove("active");
  fpDotEls[fpIndex].classList.remove("active");
  fpIndex = idx;
  fpSlides[fpIndex].classList.add("active");
  fpDotEls[fpIndex].classList.add("active");
}

let ppIndex = 0;
let ppSlides = [];
let ppDotEls = [];

function ppSlide(dir) {
  ppSlides[ppIndex].classList.remove("active");
  ppDotEls[ppIndex].classList.remove("active");
  ppIndex = (ppIndex + dir + ppSlides.length) % ppSlides.length;
  ppSlides[ppIndex].classList.add("active");
  ppDotEls[ppIndex].classList.add("active");
}

function ppGoTo(idx) {
  ppSlides[ppIndex].classList.remove("active");
  ppDotEls[ppIndex].classList.remove("active");
  ppIndex = idx;
  ppSlides[ppIndex].classList.add("active");
  ppDotEls[ppIndex].classList.add("active");
}

document.addEventListener("DOMContentLoaded", function() {
  fpSlides = Array.from(document.querySelectorAll(".fp-slide"));
  const dotsContainer = document.getElementById("fpDots");
  if (dotsContainer) {
    fpSlides.forEach(function(_, i) {
      const dot = document.createElement("button");
      dot.className = "fp-dot" + (i === 0 ? " active" : "");
      dot.setAttribute("aria-label", "Go to slide " + (i + 1));
      dot.addEventListener("click", function() { fpGoTo(i); });
      dotsContainer.appendChild(dot);
      fpDotEls.push(dot);
    });
  }

  ppSlides = Array.from(document.querySelectorAll(".pp-slide"));
  const ppDotsContainer = document.getElementById("ppDots");
  if (ppDotsContainer) {
    ppSlides.forEach(function(_, i) {
      const dot = document.createElement("button");
      dot.className = "pp-dot" + (i === 0 ? " active" : "");
      dot.setAttribute("aria-label", "Go to payment slide " + (i + 1));
      dot.addEventListener("click", function() { ppGoTo(i); });
      ppDotsContainer.appendChild(dot);
      ppDotEls.push(dot);
    });
  }
});
</script>
